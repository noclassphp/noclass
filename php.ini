; ============================================================================
; NoClass™ PHP Procedural Framework
; php.ini — Production OPcache settings
;
; IMPORTANT — THIS FILE IS LOAD-BEARING FOR THE LIB AUTO-LOADER DESIGN
; -----------------------------------------------------------------------
; NoClass setup.php auto-requires every file in lib/ at boot on every request.
; This is intentional and efficient ONLY because OPcache serves compiled opcodes
; from shared memory — no filesystem reads, no parsing.
;
; If OPcache is disabled or misconfigured in production, every request pays
; the full parse cost for every lib/ file. Always verify OPcache is active:
;
;   <?php var_dump(opcache_get_status()['opcache_enabled']); ?>
;
; DEPLOY CHECKLIST
; -----------------------------------------------------------------------
; After every code deployment you MUST reload PHP-FPM:
;
;   systemctl reload php8.x-fpm          (Linux systemd)
;   service php8.x-fpm reload            (Linux init.d)
;   iisreset                             (Windows IIS)
;
; With opcache.validate_timestamps=0 PHP never checks source files for
; changes. New code is invisible until the process restarts.
;
; This file is for WEB/FPM context only.
; For CLI context use php-development.ini or set opcache.enable_cli=0.
; ============================================================================

; ── Enable OPcache ────────────────────────────────────────────────────────────
opcache.enable=1

; Disable for CLI — CLI processes are short-lived and do not benefit from
; a shared opcode cache. Keeps filemap rebuilds and cron jobs clean.
opcache.enable_cli=0

; ── Memory ───────────────────────────────────────────────────────────────────
; Shared memory for compiled opcodes (MB).
; Increase if opcache_get_status()['memory_usage']['oom_restarts'] > 0.
opcache.memory_consumption=128

; Memory for interned strings (identifier names, string literals).
opcache.interned_strings_buffer=8

; Maximum number of PHP files that can be cached.
; Must exceed your total PHP file count:
;   find /path/to/app -name "*.php" | wc -l
opcache.max_accelerated_files=10000

; ── Timestamp validation ──────────────────────────────────────────────────────
; 0 = never check source files for changes.
; This is what makes lib/ auto-loading cost-free in production.
; REQUIRES PHP-FPM reload after every deployment (see checklist above).
opcache.validate_timestamps=0

; Irrelevant when validate_timestamps=0.
; Set explicitly so it is correct if validate_timestamps is temporarily enabled.
opcache.revalidate_freq=0

; ── Other settings ────────────────────────────────────────────────────────────
; Preserve docblock comments — required if any code reads annotations.
opcache.save_comments=1

; Faster memory release at script end.
opcache.fast_shutdown=1

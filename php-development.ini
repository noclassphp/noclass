; ============================================================================
; NoClass™ PHP Procedural Framework
; php-development.ini — Development OPcache settings
;
; IMPORTANT — THIS FILE IS LOAD-BEARING FOR THE LIB AUTO-LOADER DESIGN
; -----------------------------------------------------------------------
; In development you want code changes to take effect immediately without
; reloading PHP-FPM. opcache.validate_timestamps=1 achieves this by
; re-checking file modification times on each request.
;
; The lib/ auto-loader still works correctly — files are re-parsed when
; changed, which is exactly what you want during development.
;
; To completely disable OPcache in development (maximum simplicity):
;   opcache.enable=0
;
; Apply via php-fpm pool config or user ini:
;   php_admin_value[opcache.validate_timestamps] = 1
; ============================================================================

; ── Enable OPcache ────────────────────────────────────────────────────────────
opcache.enable=1

; Enable for CLI in development — useful for local CLI debugging and
; running filemap rebuild scripts interactively.
opcache.enable_cli=1

; ── Memory ───────────────────────────────────────────────────────────────────
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000

; ── Timestamp validation ──────────────────────────────────────────────────────
; 1 = re-check file modification times. Code changes take effect on the
; next request without any PHP-FPM reload.
; This is the key difference from production.
opcache.validate_timestamps=1

; Check on every request — no delay between saving a file and seeing the change.
opcache.revalidate_freq=0

; ── Other settings ────────────────────────────────────────────────────────────
opcache.save_comments=1

; Full cleanup at script end — better error reporting in development.
opcache.fast_shutdown=0
